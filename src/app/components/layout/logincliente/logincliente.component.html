<div class="login-background">

  <div class="login-wrapper">
    <!-- LOGO -->
    <img src="/img/logo.png" class="login-logo" alt="Logo Restaurante Dove">
  </div>

  <div class="container" style="max-width: 480px">
    <div class="card shadow login-card">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Login</h3>

        <form (ngSubmit)="loginCliente()">
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input
              id="email"
              type="email"
              class="form-control"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>

          <!-- Senha com olho -->
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>

            <div class="password-input-container">
              <input
                id="senha"
                [type]="mostrarSenha ? 'text' : 'password'"
                class="form-control"
                [(ngModel)]="senha"
                name="senha"
                required
              />

              <span class="toggle-password" (click)="mostrarSenha = !mostrarSenha">
                <i class="fa" [ngClass]="mostrarSenha ? 'fa-eye-slash' : 'fa-eye'"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-2">Entrar</button>
        </form>

        <button
          type="button"
          class="btn btn-outline-success w-100 mb-2"
          (click)="abrirCadastro()"
        >
          Cadastrar Cliente
        </button>

        <button
          type="button"
          class="btn btn-outline-secondary w-100"
          (click)="abrirLoginFuncionario()"
        >
          Login Funcionário
        </button>
      </div>
    </div>
  </div>
</div>
