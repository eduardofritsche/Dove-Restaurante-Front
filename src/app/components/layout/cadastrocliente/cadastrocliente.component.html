<div class="container mt-5" style="max-width: 400px">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Login Cliente</h3>

      <form (ngSubmit)="CadastroCliente()">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input
            id="senha"
            type="password"
            class="form-control"
            [(ngModel)]="senha"
            name="senha"
            required
          />
        </div>

        <button
          type="submit"
          class="btn btn-outline-secondary w-100"
        >
          Login Cliente
        </button>
      </form>
    </div>
  </div>
</div>
