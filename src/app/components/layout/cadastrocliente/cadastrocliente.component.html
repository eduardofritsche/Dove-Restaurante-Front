<div class="container mt-5" style="max-width: 450px">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Cadastro de Cliente</h3>

      <form (ngSubmit)="CadastroCliente()">
        <!-- Nome -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            id="nome"
            type="text"
            class="form-control"
            [(ngModel)]="nome"
            name="nome"
            required
          />
        </div>

        <!-- E-mail -->
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <!-- Senha -->
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input
            id="senha"
            type="password"
            class="form-control"
            [(ngModel)]="senha"
            name="senha"
            required
          />
        </div>

        <!-- Confirmar Senha -->
        <!-- <div class="mb-3">
          <label for="confirmarSenha" class="form-label">Confirmar Senha</label>
          <input
            id="confirmarSenha"
            type="password"
            class="form-control"
            [(ngModel)]="confirmarSenha"
            name="confirmarSenha"
            required
          />
        </div> -->

        <!-- Botão Cadastrar -->
        <button type="submit" class="btn btn-outline-success w-100">
          Cadastrar Cliente
        </button>

        <!-- Link para login -->
        <button
          type="button"
          class="btn btn-outline-secondary w-100 mt-2"
          (click)="abrirLoginCliente()"
        >
          Já tenho conta
        </button>
      </form>
    </div>
  </div>
</div>
