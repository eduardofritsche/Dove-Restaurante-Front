<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        {{ funcionario.id ? 'Editar Funcionário' : 'Novo Funcionário' }}
      </h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="salvar()">
        <!-- Nome -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            id="nome"
            type="text"
            class="form-control"
            [(ngModel)]="nome"
            name="nome"
            required
          />
        </div>

        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Nome de Usuário</label>
          <input
            id="username"
            type="text"
            class="form-control"
            [(ngModel)]="username"
            name="username"
            required
          />
        </div>

        <!-- CPF -->
        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input
            id="cpf"
            type="text"
            class="form-control"
            [(ngModel)]="cpf"
            name="cpf"
            required
          />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <!-- Senha com olho -->
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>

          <div class="password-input-container">
            <input
              id="senha"
              [type]="mostrarSenhaCadastro ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="senha"
              name="senha"
              required
            />

            <span
              class="toggle-password"
              (click)="mostrarSenhaCadastro = !mostrarSenhaCadastro"
            >
              <i
                class="fa"
                [ngClass]="mostrarSenhaCadastro ? 'fa-eye-slash' : 'fa-eye'"
              ></i>
            </span>
          </div>
        </div>

        <!-- Botões -->
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-secondary me-2" (click)="router.navigate(['/admin/funcionarios'])">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary">
            {{ funcionario.id ? 'Salvar Alterações' : 'Cadastrar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
