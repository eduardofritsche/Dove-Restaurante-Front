<div class="login-background">
<div class="container mt-5" style="max-width: 480px">
  <div class="card shadow">
    <div class="card-body">
      <h3 class="card-title text-center mb-4">Cadastro de Funcionario</h3>

      <form (ngSubmit)="CadastroFuncionario()">

        <!-- Nome -->
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input
            id="nome"
            type="text"
            class="form-control"
            [(ngModel)]="nome"
            name="nome"
            required
          />
        </div>

                <!-- CPF -->
        <div class="mb-3">
          <label for="nome" class="form-label">CPF</label>
          <input
            id="CPF"
            type="text"
            class="form-control"
            [(ngModel)]="cpf"
            name="cpf"
            required
          />
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>

        <!-- Senha com olho -->
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>

          <div class="password-input-container">
            <input
              id="senha"
              [type]="mostrarSenhaCadastro ? 'text' : 'password'"
              class="form-control"
              [(ngModel)]="senha"
              name="senha"
              required
            />

            <span
              class="toggle-password"
              (click)="mostrarSenhaCadastro = !mostrarSenhaCadastro"
            >
              <i
                class="fa"
                [ngClass]="mostrarSenhaCadastro ? 'fa-eye-slash' : 'fa-eye'"
              ></i>
            </span>
          </div>
        </div>

        <!-- Botão Cadastrar -->
        <button type="submit" class="btn btn-outline-success w-100">
          Cadastrar Cliente
        </button>

        <!-- Link para login -->
        <button
          type="button"
          class="btn btn-outline-secondary w-100 mt-2"
          (click)="abrirLogin()"
        >
          Já tenho conta
        </button>
      </form>
    </div>
  </div>
 </div>
</div>
