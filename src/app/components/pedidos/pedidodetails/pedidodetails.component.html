<div class="container">
  <div class="card">
    <div class="card-body">
      <form (ngSubmit)="salvar(pedido)">
        <div class="mb-3">
          <label for="marmita" class="form-label">Marmita</label>
          <input
            id="marmita"
            type="text"
            class="form-control"
            [(ngModel)]="pedido.marmita"
            name="marmita"
            required
          />
        </div>

        <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <input
            id="status"
            type="text"
            class="form-control"
            [(ngModel)]="pedido.status"
            name="status"
            required
          />
        </div>

        <div class="mb-3">
          <label for="hora_inicio" class="form-label">Hora Início</label>
          <input
            id="hora_inicio"
            type="time"
            class="form-control"
            [(ngModel)]="pedido.hora_inicio"
            name="hora_inicio"
            required
          />
        </div>

        <div class="mb-3">
          <label for="hora_fim" class="form-label">Hora Fim</label>
          <input
            id="hora_fim"
            type="time"
            class="form-control"
            [(ngModel)]="pedido.hora_fim"
            name="hora_fim"
          />
        </div>

        <div class="mb-3">
          <label for="cliente" class="form-label">Cliente</label>
          <input
            id="cliente"
            type="text"
            class="form-control"
            [(ngModel)]="pedido.cliente.nome"
            name="cliente"
            disabled
          />
        </div>

        <div class="mb-3">
          <label for="funcionario" class="form-label">Funcionário</label>
          <input
            id="funcionario"
            type="text"
            class="form-control"
            [(ngModel)]="pedido.funcionario.nome"
            name="funcionario"
            disabled
          />
        </div>

        <div class="mb-3">
          <label for="cardapio" class="form-label">Cardápio</label>
          <input
            id="cardapio"
            type="text"
            class="form-control"
            [(ngModel)]="pedido.cardapio.data"
            name="cardapio"
            disabled
          />
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
      </form>
    </div>
  </div>
</div>
