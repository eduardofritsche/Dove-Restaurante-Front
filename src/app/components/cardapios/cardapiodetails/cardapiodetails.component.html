<div class="container cardapio-details">
  <div class="card">
    <div class="card-body">
      <form (ngSubmit)="salvar(cardapio)">
        <!-- Campo Data -->
        <div class="mb-3">
          <label for="data" class="form-label">Data</label>
          <input
            id="data"
            type="date"
            class="form-control"
            [(ngModel)]="cardapio.data"
            name="data"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Ingredientes</label>
          <div class="list-group">
            @for (ing of ingredientes; track ing.id) {
            <label
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3 px-3"
              [class.active]="isChecked(ing.id)"
            >
              <span>{{ ing.descricao }}</span>
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="isChecked(ing.id)"
                (change)="toggleIngrediente(ing, $event)"
              />
            </label>
            }
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
      </form>
    </div>
  </div>
</div>
